<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@faker-js/faker"></script>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Product Registration</h2>
    <form action="/product" method="POST">
        <div class="mb-3">
            <label for="name" class="form-label">Product Name:</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <textarea id="description" name="description" class="form-control" required></textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price:</label>
            <input type="number" id="price" name="price" class="form-control" step="0.01" min="0" required>
        </div>
        <div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <button type="button" id="autofill" class="btn btn-secondary ms-2">Autofill</button>
        </div>
    </form>
</div>
<script type="module">
    import {faker} from 'https://cdn.jsdelivr.net/npm/@faker-js/faker/+esm';

    document.getElementById('autofill').addEventListener('click', () => {
        document.getElementById('name').value = faker.commerce.productName();
        document.getElementById('description').value = faker.commerce.productDescription();
        document.getElementById('price').value = faker.commerce.price({min: 1, max: 1000, dec: 2});
    });
</script>
</body>
</html>
